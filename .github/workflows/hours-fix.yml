name: Fix hours rendering
on:
  push:
    paths:
      - .github/workflows/hours-fix.yml
permissions:
  contents: write
jobs:
  fix-hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add defensive hours rendering
        run: |
          python3 <<'PYEOF'
          import sys, pathlib
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'tk-hours-defensive'
          if marker in s:
              print('defensive script already present; nothing to do')
          else:
              script = '''<script>/* tk-hours-defensive: ensures the full 7-day store hours render even if the primary PRICES-based rendering leaves times blank. */
          document.addEventListener('DOMContentLoaded', function() {
            var hg = document.getElementById('site-hours-grid');
            if (!hg) return;
            var times = hg.querySelectorAll('.time');
            var missing = times.length < 7;
            for (var i = 0; i < times.length && !missing; i++) {
              if (!times[i].textContent.trim()) missing = true;
            }
            if (missing) {
              var hours = [
                { day: 'Monday', time: '7:00 AM \u2013 2:30 PM' },
                { day: 'Tuesday', time: 'CLOSED' },
                { day: 'Wednesday', time: '7:00 AM \u2013 2:30 PM' },
                { day: 'Thursday', time: '7:00 AM \u2013 2:30 PM' },
                { day: 'Friday', time: '7:00 AM \u2013 2:30 PM' },
                { day: 'Saturday', time: '7:00 AM \u2013 2:30 PM' },
                { day: 'Sunday', time: '7:00 AM \u2013 2:30 PM' }
              ];
              hg.innerHTML = hours.map(function(h) {
                return '<span class="day">' + h.day + '</span><span class="time">' + h.time + '</span>';
              }).join('');
            }
          });
          </script>'''
              if s.count('</body>') != 1:
                  print('FAIL: expected exactly one </body>'); sys.exit(1)
              s = s.replace('</body>', script + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('defensive hours script added')
          print('HOURS FIX APPLIED')
          PYEOF
      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -q .github/workflows/hours-fix.yml
          git commit -m "Ensure full store hours render (defensive hours script)" || echo "nothing to commit"
          git push
