name: Fix Donut Holes display
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the em dash on the Donut Holes line
        run: sed -i '454s/—/$2.79 \/ dozen/' index.html
      - name: Commit if changed
        run: |
          git config user.name "marny12"
          git config user.email "tasteekingdonuts5@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show Donut Holes as $2.79 / dozen on homepage"
          git push
